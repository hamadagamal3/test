// Seed demo data if the DB is completely empty and we haven't seeded before —
// covers first run, and also an older empty file opened previously in this browser —
// but never reseed after the user has deliberately wiped everything.
const dbIsEmpty = Object.values(DB).every(arr => arr.length === 0);
if(dbIsEmpty && localStorage.getItem(SEEDED_FLAG) !== '1'){
  seedDemoData();
  localStorage.setItem(SEEDED_FLAG, '1');
  save();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function findById(arr, id){ return arr.find(x=>x.id===id); }
function num(v){ return Number(v||0); }
function fmt(v){ return num(v).toLocaleString('en-US',{maximumFractionDigits:2}); }
function materialStock(materialId){
  const mat = findById(DB.materials, materialId); if(!mat) return 0;
  const purchased = DB.purchases.filter(p=>p.materialId===materialId).reduce((s,p)=>s+num(p.qty),0);
  const issued = DB.materialIssues.filter(i=>i.materialId===materialId).reduce((s,i)=>s+num(i.qty),0);
  return num(mat.openingQty)+purchased-issued;
}
function materialAvgPrice(materialId){
  const list = DB.purchases.filter(p=>p.materialId===materialId);
  if(!list.length) return 0;
  const totalQty = list.reduce((s,p)=>s+num(p.qty),0);
  const totalVal = list.reduce((s,p)=>s+num(p.qty)*num(p.unitPrice),0);
  return totalQty ? totalVal/totalQty : 0;
}

/* extra computed columns for tables (label -> function(record)) */
const COMPUTED = {
  materials:(r)=>{
    const stock = materialStock(r.id);
    const low = stock < num(r.minQty);
    return {'الرصيد الحالي بالمخزن': `<b>${fmt(stock)}</b> ${r.unit||''} ` + (low?`<span class="badge neg">⚠️ تحت حد الأمان</span>`:`<span class="badge pos">✔️ طبيعي</span>`)};
  },
  materialIssues:(r)=>{
    const stockNow = materialStock(r.materialId);
    return {'الرصيد الحالي لهذه المادة بالمخزن':fmt(stockNow)};
  },
  clients:(r)=>{
    const myProjects = DB.projects.filter(p=>p.clientId===r.id).map(p=>p.id);
    const due = DB.clientExtracts.filter(e=>myProjects.includes(e.projectId))
      .reduce((s,e)=>{ const c=COMPUTED.clientExtracts(e); return s+parseFloat((c['صافي المستحق']||'0').replace(/,/g,'')); },0);
    const collected = DB.clientPayments.filter(p=>p.clientId===r.id).reduce((s,p)=>s+num(p.amount),0);
    const balance = num(r.openingBalance)+due-collected;
    return {'إجمالي المستخلصات المستحقة':fmt(due), 'إجمالي المحصل':fmt(collected), 'الرصيد الحالي (تقديري)':fmt(balance)};
  },
  clientExtracts:(r)=>{
    const list=DB.clientExtracts.filter(x=>x.projectId===r.projectId).sort((a,b)=>a.number-b.number);
    const idx=list.findIndex(x=>x.id===r.id);
    const prev = idx>0 ? num(list[idx-1].cumulativeValue) : 0;
    const current = num(r.cumulativeValue)-prev;
    const retention = current*num(r.retentionPercent)/100;
    const advance = current*num(r.advancePercent)/100;
    const tax = current*num(r.taxPercent)/100;
    const net = current-retention-advance-tax;
    return {'دفعة سابقة':fmt(prev),'قيمة الدفعة الحالية':fmt(current),'ضمان محتجز':fmt(retention),'صافي المستحق':fmt(net)};
  },
  subcontractorExtracts:(r)=>{
    const list=DB.subcontractorExtracts.filter(x=>x.contractId===r.contractId).sort((a,b)=>a.number-b.number);
    const idx=list.findIndex(x=>x.id===r.id);
    const prev = idx>0 ? num(list[idx-1].cumulativeValue) : 0;
    const current = num(r.cumulativeValue)-prev;
    const retention = current*num(r.retentionPercent)/100;
    const advance = current*num(r.advancePercent)/100;
    const net = current-retention-advance;
    return {'دفعة سابقة':fmt(prev),'قيمة الدفعة الحالية':fmt(current),'ضمان محتجز':fmt(retention),'صافي المستحق':fmt(net)};
  },
  purchases:(r)=>({'الإجمالي':fmt(num(r.qty)*num(r.unitPrice))}),
  projects:(r)=>{
    const extr=DB.clientExtracts.filter(x=>x.projectId===r.id);
    const totalCollected = extr.reduce((s,e)=>{
      const c=COMPUTED.clientExtracts(e); return s+parseFloat((c['صافي المستحق']||'0').replace(/,/g,''));
    },0);
    const prog=DB.progress.filter(x=>x.projectId===r.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const lastPct = prog.length? prog[prog.length-1].percent+'%' : '—';
    const materialsCost = DB.materialIssues.filter(i=>i.projectId===r.id)
      .reduce((s,i)=>s+num(i.qty)*materialAvgPrice(i.materialId),0);
    return {'آخر نسبة إنجاز':lastPct, 'صافي المحصل من العميل':fmt(totalCollected), 'قيمة المواد المنصرفة (تقديري)':fmt(materialsCost)};
  }
};

/* ============ GENERIC CRUD RENDER ============ */
let editState = {}; // module -> id being edited

function getRefOptions(ref){ return (DB[ref]||[]); }

function renderForm(moduleKey){
  const fields = FIELDS[moduleKey];
  const editing = editState[moduleKey];
  const record = editing ? findById(DB[moduleKey], editing) : null;
  let html = `<div class="form-section"><div class="form-row">`;
  fields.forEach(f=>{
    const val = record ? (record[f.name] ?? '') : (f.default ?? '');
    html += `<div class="form-group"><label>${f.label}${f.required?' *':''}</label>`;
    if(f.type==='select'){
      let opts = f.options ? f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')
        : getRefOptions(f.ref).map(r=>`<option value="${r.id}" ${val===r.id?'selected':''}>${f.refLabel(r)}</option>`).join('');
      const extraAttrs = (moduleKey==='materialIssues' && f.name==='materialId') ? ' onchange="updateStockHint()"' : '';
      html += `<select id="fld_${moduleKey}_${f.name}"${extraAttrs}><option value="">-- اختر --</option>${opts}</select>`;
    } else {
      html += `<input id="fld_${moduleKey}_${f.name}" type="${f.type}" value="${val}">`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  if(moduleKey==='materialIssues'){
    html += `<div id="stockHint" style="margin-bottom:14px;color:#7c2d12;font-weight:bold;"></div>`;
  }
  html += `<div class="toolbar">
    <button class="btn" onclick="saveRecord('${moduleKey}')">${editing?'💾 حفظ التعديل':'➕ إضافة'}</button>
    ${editing?`<button class="btn secondary" onclick="cancelEdit('${moduleKey}')">إلغاء</button>`:''}
    <button class="btn secondary" onclick="exportModule('${moduleKey}')">⬇️ تصدير Excel</button>
  </div></div>`;
  return html;
}
function updateStockHint(){
  const sel = document.getElementById('fld_materialIssues_materialId');
  const hint = document.getElementById('stockHint');
  if(!sel || !hint) return;
  const mat = findById(DB.materials, sel.value);
  if(!mat){ hint.textContent = ''; return; }
  const stock = materialStock(mat.id);
  hint.textContent = `📦 الرصيد المتاح حاليًا من "${mat.name}": ${fmt(stock)} ${mat.unit||''}`;
}

function renderTable(moduleKey){
  const fields = FIELDS[moduleKey];
  const rows = DB[moduleKey];
  if(!rows.length) return `<div class="empty">لا توجد بيانات بعد</div>`;
  const computedFn = COMPUTED[moduleKey];
  const extraLabels = computedFn ? Object.keys(computedFn(rows[0])) : [];
  let html = `<div class="table-wrap"><table><thead><tr>`;
  fields.forEach(f=> html += `<th>${f.label}</th>`);
  extraLabels.forEach(l=> html += `<th>${l}</th>`);
  html += `<th>إجراءات</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    html += `<tr>`;
    fields.forEach(f=>{
      let display = r[f.name] ?? '';
      if(f.type==='select' && f.ref){
        const ref = findById(DB[f.ref], display);
        display = ref ? f.refLabel(ref) : '—';
      }
      html += `<td>${display===''?'—':display}</td>`;
    });
    if(computedFn){
      const c = computedFn(r);
      Object.values(c).forEach(v=> html += `<td>${v}</td>`);
    }
    html += `<td>
      <button class="btn small" onclick="editRecord('${moduleKey}','${r.id}')">✏️</button>
      <button class="btn danger" onclick="deleteRecord('${moduleKey}','${r.id}')">🗑️</button>
    </td></tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function renderCrudTab(moduleKey, title){
  return `<div class="section-title">${title}</div>` + renderForm(moduleKey) + renderTable(moduleKey);
}

function saveRecord(moduleKey){
  const fields = FIELDS[moduleKey];
  const editing = editState[moduleKey];
  const target = editing ? findById(DB[moduleKey], editing) : null;
  const draft = editing ? {...target} : {id:uid()};
  for(const f of fields){
    const el = document.getElementById(`fld_${moduleKey}_${f.name}`);
    let v = el.value;
    if(f.required && !v){ alert('من فضلك املأ الحقل: '+f.label); return; }
    draft[f.name] = f.type==='number' ? (v===''?'':Number(v)) : v;
  }
  if(moduleKey==='materialIssues' && draft.materialId){
    const originalQty = editing ? num(target.qty) : 0;
    const currentStock = materialStock(draft.materialId) + originalQty;
    if(num(draft.qty) > currentStock){
      if(!confirm(`⚠️ الكمية المطلوب صرفها (${fmt(draft.qty)}) أكبر من الرصيد المتاح بالمخزن (${fmt(currentStock)}).\nهل تريد المتابعة رغم ذلك؟`)) return;
    }
  }
  if(editing){ Object.assign(target, draft); } else { DB[moduleKey].push(draft); }
  editState[moduleKey] = null;
  save(); renderActiveTab();
}
function editRecord(moduleKey,id){ editState[moduleKey]=id; renderActiveTab(); }
function cancelEdit(moduleKey){ editState[moduleKey]=null; renderActiveTab(); }
function deleteRecord(moduleKey,id){
  if(!confirm('تأكيد الحذف؟')) return;
  DB[moduleKey] = DB[moduleKey].filter(x=>x.id!==id);
  save(); renderActiveTab();
}
function exportModule(moduleKey){
  const fields = FIELDS[moduleKey];
  const data = DB[moduleKey].map(r=>{
    const row = {};
    fields.forEach(f=>{
      let v = r[f.name] ?? '';
      if(f.type==='select' && f.ref){ const ref=findById(DB[f.ref], v); v = ref? f.refLabel(ref):''; }
      row[f.label] = v;
    });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, moduleKey.slice(0,30));
  XLSX.writeFile(wb, moduleKey+'.xlsx');
}

function renderPayroll(){
  const month = document.getElementById('payrollMonth')?.value || new Date().toISOString().slice(0,7);
  let rows = DB.workers.map(w=>{
    const att = DB.attendance.filter(a=>a.workerId===w.id && (a.date||'').startsWith(month));
    const daysPresent = att.filter(a=>a.status==='حاضر').length;
    const overtimeHours = att.reduce((s,a)=>s+num(a.overtimeHours),0);
    const base = daysPresent*num(w.dailyWage);
    const overtimePay = overtimeHours*(num(w.dailyWage)/8)*1.5;

    return {name:w.name, jobTitle:w.jobTitle, daysPresent, overtimeHours, base, overtimePay, total};
  });
  let html = `<div class="section-title">💰 كشف الرواتب الشهري</div>

    <div class="form-group"><label>الشهر</label><input type="month" id="payrollMonth" value="${month}" onchange="renderActiveTab()"></div>

    <th>الأجر الأساسي</th><th>مقابل الإضافي</th><th>الإجمالي</th></tr></thead><tbody>`;
  let grand = 0;
  rows.forEach(r=>{
    grand += r.total;
    html += `<tr><td>${r.name}</td><td>${r.jobTitle||'—'}</td><td>${r.daysPresent}</td><td>${r.overtimeHours}</td>
      <td>${fmt(r.base)}</td><td>${fmt(r.overtimePay)}</td><td><b>${fmt(r.total)}</b></td></tr>`;

function exportPayroll(month){
  const rows = DB.workers.map(w=>{

    const overtimeHours = att.reduce((s,a)=>s+num(a.overtimeHours),0);
    const base = daysPresent*num(w.dailyWage);

/* ============ RETENTION (الضمانات المحتجزة) ============ */
function renderRetention(){
  const byProject = DB.projects.map(p=>{
    const extracts = DB.clientExtracts.filter(e=>e.projectId===p.id).sort((a,b)=>a.number-b.number);
    let held = 0;
    extracts.forEach((e,idx)=>{
      const prev = idx>0? num(extracts[idx-1].cumulativeValue):0;
      const current = num(e.cumulativeValue)-prev;
      held += current*num(e.retentionPercent)/100;
    });
    const released = DB.retentionReleases.filter(r=>r.type==='client' && r.refId===p.id).reduce((s,r)=>s+num(r.amount),0);
    return {id:p.id, label:p.code+' - '+p.name, held, released, balance: held-released};
  }).filter(x=>x.held>0 || x.released>0);

  const byContract = DB.subcontractorContracts.map(c=>{
    const sc = findById(DB.subcontractors,c.subcontractorId), p = findById(DB.projects,c.projectId);
    const extracts = DB.subcontractorExtracts.filter(e=>e.contractId===c.id).sort((a,b)=>a.number-b.number);
    let held = 0;
    extracts.forEach((e,idx)=>{
      const prev = idx>0? num(extracts[idx-1].cumulativeValue):0;
      const current = num(e.cumulativeValue)-prev;
      held += current*num(e.retentionPercent)/100;
    });
    const released = DB.retentionReleases.filter(r=>r.type==='subcontractor' && r.refId===c.id).reduce((s,r)=>s+num(r.amount),0);
    return {id:c.id, label:(sc?sc.name:'?')+' / '+(p?p.name:'?'), held, released, balance: held-released};
  }).filter(x=>x.held>0 || x.released>0);

  const projOptions = byProject.map(x=>`<option value="${x.id}">${x.label}</option>`).join('');
  const contractOptions = byContract.map(x=>`<option value="${x.id}">${x.label}</option>`).join('');

  let html = `<div class="section-title">🔒 ضمانات العملاء المحتجزة (لصالحنا حتى الإفراج)</div>`;
  html += byProject.length ? `<div class="table-wrap"><table><thead><tr><th>المشروع</th><th>إجمالي المحتجز</th><th>تم الإفراج عنه</th><th>الرصيد الحالي</th></tr></thead><tbody>` +
    byProject.map(x=>`<tr><td>${x.label}</td><td>${fmt(x.held)}</td><td>${fmt(x.released)}</td><td><b>${fmt(x.balance)}</b></td></tr>`).join('') + `</tbody></table></div>`
    : `<div class="empty">لا توجد مستخلصات عملاء بعد</div>`;

  html += `<div class="section-title">🔒 ضمانات مقاولي الباطن المحتجزة (عليهم لصالحنا)</div>`;
  html += byContract.length ? `<div class="table-wrap"><table><thead><tr><th>المقاول / المشروع</th><th>إجمالي المحتجز</th><th>تم الإفراج عنه</th><th>الرصيد الحالي</th></tr></thead><tbody>` +
    byContract.map(x=>`<tr><td>${x.label}</td><td>${fmt(x.held)}</td><td>${fmt(x.released)}</td><td><b>${fmt(x.balance)}</b></td></tr>`).join('') + `</tbody></table></div>`
    : `<div class="empty">لا توجد مستخلصات مقاولي باطن بعد</div>`;

  html += `<div class="section-title">➕ تسجيل إفراج عن ضمان</div>
  <div class="form-section"><div class="form-row">
    <div class="form-group"><label>نوع الضمان</label><select id="relType" onchange="renderActiveTab()">
      <option value="client">ضمان عميل (مشروع)</option><option value="subcontractor">ضمان مقاول باطن</option></select></div>
    <div class="form-group"><label>${document.getElementById('relType')?.value==='subcontractor'?'عقد الباطن':'المشروع'}</label>
      <select id="relRef">${document.getElementById('relType')?.value==='subcontractor'?contractOptions:projOptions}</select></div>
    <div class="form-group"><label>التاريخ</label><input type="date" id="relDate"></div>
    <div class="form-group"><label>المبلغ المفرج عنه</label><input type="number" id="relAmount"></div>
    <div class="form-group"><label>ملاحظات</label><input type="text" id="relNotes"></div>
  </div><div class="toolbar"><button class="btn" onclick="addRetentionRelease()">💾 حفظ</button></div></div>`;

  if(DB.retentionReleases.length){
    html += `<div class="section-title">سجل الإفراجات</div><div class="table-wrap"><table><thead><tr><th>النوع</th><th>المرجع</th><th>التاريخ</th><th>المبلغ</th><th>ملاحظات</th><th></th></tr></thead><tbody>`;
    DB.retentionReleases.forEach(r=>{
      let refLabel = '—';
      if(r.type==='client'){ const p=findById(DB.projects,r.refId); refLabel = p? p.code+' - '+p.name : '—'; }
      else { const c=findById(DB.subcontractorContracts,r.refId); if(c){ const sc=findById(DB.subcontractors,c.subcontractorId); refLabel = sc?sc.name:'—'; } }
      html += `<tr><td>${r.type==='client'?'عميل':'مقاول باطن'}</td><td>${refLabel}</td><td>${r.date||'—'}</td><td>${fmt(r.amount)}</td><td>${r.notes||'—'}</td>
        <td><button class="btn danger" onclick="deleteRetentionRelease('${r.id}')">🗑️</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  return html;
}
function addRetentionRelease(){
  const type = document.getElementById('relType').value;
  const refId = document.getElementById('relRef').value;
  const amount = document.getElementById('relAmount').value;
  if(!refId || !amount){ alert('من فضلك اختر المرجع وأدخل المبلغ'); return; }
  DB.retentionReleases.push({id:uid(), type, refId, date:document.getElementById('relDate').value, amount:Number(amount), notes:document.getElementById('relNotes').value});
  save(); renderActiveTab();
}
function deleteRetentionRelease(id){
  if(!confirm('تأكيد الحذف؟')) return;
  DB.retentionReleases = DB.retentionReleases.filter(x=>x.id!==id);
  save(); renderActiveTab();
}

function importAllExcel(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const newDB = {};
      Object.keys(DB).forEach(key=>{
        if(wb.SheetNames.includes(key)){
          const sheet = wb.Sheets[key];
          let json = XLSX.utils.sheet_to_json(sheet, {defval:''});
          json = json.filter(r=>Object.keys(r).length>0 && r.id!=='');
          newDB[key] = json;
        } else { newDB[key] = []; }
      });
      DB = newDB; save(); renderActiveTab();
      alert('تم استيراد النسخة الاحتياطية بنجاح');
    } catch(err){ alert('ملف غير صالح: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function wipeAll(){
  if(!confirm('سيتم تصفير كل البيانات نهائيًا. متأكد؟')) return;
  Object.keys(DB).forEach(k=>DB[k]=[]);
  localStorage.setItem(SEEDED_FLAG, '1');
  save(); renderActiveTab();
}
function checkAutoBackup(){
  const last = Number(localStorage.getItem('lastBackupTime')||0);
  const hasData = Object.values(DB).some(arr=>arr.length>0);
  if(hasData && Date.now()-last > 24*60*60*1000){ exportAllExcel(); }
}

/* ============ ROUTER ============ */
const CRUD_TITLES = {
  projects:'🏗️ المشاريع', clients:'👥 العملاء', contracts:'📑 العقود',
  clientExtracts:'📄 مستخلصات العملاء', clientPayments:'💵 تحصيل من العملاء',
  suppliers:'🚚 الموردين', materials:'📦 المواد والمخزون',
  purchases:'🛒 المشتريات', materialIssues:'📤 صرف مواد للمشاريع', workers:'👷 العمال',
  attendance:'🕒 الحضور والانصراف', subcontractors:'🔧 المقاولون الباطن',
  subcontractorContracts:'📃 عقود الباطن', subcontractorExtracts:'📄 مستخلصات الباطن',
  progress:'📈 نسب التنفيذ', equipment:'🚜 المعدات والآليات', expenses:'💸 المصروفات'
};

function renderActiveTab(){
  const content = document.getElementById('content');
  if(activeTab==='dashboard') content.innerHTML = `<div class="tab-content active">${renderDashboard()}</div>`;
  else if(activeTab==='payroll') content.innerHTML = `<div class="tab-content active">${renderPayroll()}</div>`;
  else if(activeTab==='retention') content.innerHTML = `<div class="tab-content active">${renderRetention()}</div>`;
  else if(activeTab==='settings') content.innerHTML = `<div class="tab-content active">${renderSettings()}</div>`;
  else content.innerHTML = `<div class="tab-content active">${renderCrudTab(activeTab, CRUD_TITLES[activeTab])}</div>`;
  if(activeTab==='materialIssues') updateStockHint();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.key===activeTab));
}
function showTab(key){ activeTab = key; renderActiveTab(); }

function initTabsBar(){
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = TABS.map(t=>`<button class="tab" data-key="${t.key}" onclick="showTab('${t.key}')">${t.label}</button>`).join('');
}
initTabsBar();
renderActiveTab();
checkAutoBackup();
setInterval(checkAutoBackup, 60*60*1000);
</script>
